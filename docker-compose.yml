services:
  web:
    build:
      context: .
    command: bash -lc "rm -f tmp/pids/server.pid && bundle exec rails db:prepare && bundle exec rails server -b 0.0.0.0"
    environment:
      RAILS_ENV: development
      REDIS_URL: redis://redis:6379/1
    ports:
      - "3000:3000"
    volumes:
      - .:/rails
      - storage:/rails/storage
      - tmp:/rails/tmp
    depends_on:
      - redis
      - mailcatcher

  redis:
    restart: always
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - "redis:/data"

  mailcatcher:
    restart: always
    image: schickling/mailcatcher
    ports:
      - "1080:1080"
      - "1025:1025"

volumes:
  redis:
  storage:
  tmp:
